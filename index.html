<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d0716" />
<title>ADHD Timeline</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/fonts.css" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/timeline-vertical.css" />
<link rel="stylesheet" href="css/timeline-horizontal.css" />
<script>
  // Apply the persisted theme synchronously, before first paint, so there's
  // no flash of the wrong palette while the module scripts below load.
  // theming.js re-applies (and reconciles against IndexedDB) once it loads;
  // this is only the pre-paint fast path, mirrored in localStorage.
  (function () {
    try {
      var get = function (k, d) {
        var raw = localStorage.getItem("adhdtimeline:" + k);
        return raw === null ? d : JSON.parse(raw);
      };
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      var root = document.documentElement;
      root.setAttribute("data-theme", get("theme", prefersDark ? "dark-gray" : "light-neutral"));
      root.setAttribute("data-flair", get("flair", "subtle"));
      root.setAttribute("data-reduce-motion", String(Boolean(get("reduceMotion", false))));
      root.setAttribute("data-font", get("font", "atkinson"));
      root.style.setProperty("--line-height-base", String(get("lineHeight", 1.5)));
      root.style.setProperty("--letter-spacing-base", get("letterSpacing", 0) + "em");
    } catch (e) {
      /* localStorage unavailable — CSS fallback tokens still apply */
    }
  })();
</script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1 class="app-title">ADHD Timeline</h1>
      <div class="app-header-actions">
        <button id="view-toggle-btn" type="button" class="icon-btn" aria-label="Switch timeline view">
          <span aria-hidden="true">⇄</span>
        </button>
        <button id="settings-btn" type="button" class="icon-btn" aria-label="Open settings">
          <span aria-hidden="true">⚙</span>
        </button>
      </div>
    </header>

    <div id="quick-add-container"></div>
    <div id="toast-region" class="toast-region" aria-live="polite"></div>

    <main class="app-main">
      <div id="timeline-container" class="timeline-container"></div>
    </main>
  </div>

  <div id="modal-root"></div>

  <script src="js/vendor/rrule.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
